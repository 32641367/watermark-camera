name: watermark_camera
description: 水印相机 - 拍照自动添加时间、地点、自定义文字水印
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 相机
  camera: ^0.10.5

  # 图片处理
  image: ^4.1.3

  # 权限管理
  permission_handler: ^11.1.0

  # 地理位置
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # 相册保存
  image_gallery_saver: ^2.0.3

  # 路径
  path_provider: ^2.1.1

  # 分享
  share_plus: ^7.2.1

  # 状态管理
  provider: ^6.1.1

  # 本地存储
  shared_preferences: ^2.2.2

  # 设备信息
  device_info_plus: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
