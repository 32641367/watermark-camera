# Codemagic 云端编译配置
# iOS 原生工程会在编译时通过 `flutter create` 自动生成
workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create iOS platform
        script: |
          flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .
      - name: Set iOS deployment target
        script: |
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '12.0'/g" ios/Podfile || true
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com
