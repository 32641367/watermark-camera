name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (verbose)
        run: flutter build ipa --release --no-codesign --verbose 2>&1 | tee build.log

      - name: List all built files
        run: |
          echo "=== build/ contents ==="
          find build -type f 2>/dev/null
          echo "=== ios/build/ contents (if exists) ==="
          find ios/build -type f 2>/dev/null | head -20
          echo "=== All .app bundles ==="
          find . -name "*.app" -type d 2>/dev/null
          echo "=== Build log tail ==="
          tail -30 build.log 2>/dev/null

      - name: Package build directory
        run: |
          mkdir -p output
          # Try to copy anything that looks like an artifact
          if [ -d "build/ios/ipa" ]; then
            cp -r build/ios/ipa/* output/ 2>/dev/null || true
          fi
          # Find any .app bundle
          APP_DIR=$(find . -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_DIR" ]; then
            echo "Found .app: $APP_DIR"
            cp -r "$APP_DIR" output/Runner.app
          fi
          # Show what's in output
          echo "=== output/ contents ==="
          ls -la output/

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: output/
          if-no-files-found: warn
          retention-days: 7
