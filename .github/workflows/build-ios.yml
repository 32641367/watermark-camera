name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS
        run: flutter build ipa --release --no-codesign

      - name: Show all built files
        run: |
          echo "=== ALL FILES IN build/ ==="
          find build -type f 2>/dev/null
          echo "=== ALL .ipa FILES ==="
          find . -name "*.ipa" 2>/dev/null
          echo "=== ALL .app BUNDLES ==="
          find . -name "*.app" -type d 2>/dev/null
          echo "=== END ==="

      - name: Copy IPA to workspace root
        run: |
          IPA_FILE=$(find . -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "$IPA_FILE" ]; then
            echo "Found IPA: $IPA_FILE"
            mkdir -p output
            cp "$IPA_FILE" output/watermark-camera.ipa
            ls -la output/
          else
            echo "NO IPA FOUND!"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: output/watermark-camera.ipa
          retention-days: 7
