name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no-codesign skips IPA)
        run: flutter build ipa --release --no-codesign

      - name: Locate xcarchive
        run: |
          echo "=== build/ios contents ==="
          find build/ios -maxdepth 3 -type d 2>/dev/null
          echo "=== xcarchive contents ==="
          find build/ios/archive -type f 2>/dev/null | head -20

      - name: Package Runner.app from xcarchive
        run: |
          # xcarchive 内部结构: Products/Applications/Runner.app
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p output
            cp -r "$APP_PATH" output/Runner.app
            echo "=== Packaged successfully ==="
            ls -la output/
          else
            echo "Runner.app not found at: $APP_PATH"
            find build/ios -name "*.app" -type d
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera
          path: |
            output/Runner.app
            build/ios/archive/Runner.xcarchive
          if-no-files-found: warn
          retention-days: 7
