name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS
        run: flutter build ipa --release --no-codesign

      - name: Show built files
        run: |
          echo "=== build directory tree ==="
          find build -type f 2>/dev/null
          echo "=== END ==="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            build/ios/ipa/*.ipa
            build/ios/**/*.ipa
            build/**/*.ipa
          if-no-files-found: warn
          retention-days: 7
