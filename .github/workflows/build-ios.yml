name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS
        run: flutter build ipa --release --no-codesign

      - name: Package as IPA
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          echo "APP_PATH: $APP_PATH"
          echo "=== Runner.app contents ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist ==="
          cat "$APP_PATH/Info.plist" | head -20
          echo "=== Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "(no Frameworks dir)"
          echo "=== Packaging ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y watermark-camera.ipa Payload
          rm -rf Payload
          echo "IPA size:"
          ls -lh watermark-camera.ipa
          echo "=== Verify IPA ==="
          unzip -l watermark-camera.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera
          path: watermark-camera.ipa
          retention-days: 7
