name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Clean code signature
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          # 删除旧的签名残留，方便爱思助手重新签名
          rm -rf "$APP_PATH/_CodeSignature" 2>/dev/null || true
          rm -f "$APP_PATH/embedded.mobileprovision" 2>/dev/null || true
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist bundle id ==="
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist"

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y watermark-camera.ipa Payload
          rm -rf Payload
          ls -lh watermark-camera.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera
          path: watermark-camera.ipa
          retention-days: 7
