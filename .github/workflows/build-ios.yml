name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS project
        run: flutter create --platforms=ios --org com.watermarkcamera --project-name watermark_camera .

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Add iOS permissions
        run: |
          PLIST="ios/Runner/Info.plist"
          # 相机权限
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '需要使用相机来拍摄水印照片'" "$PLIST"
          # 麦克风权限（录像用）
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '需要使用麦克风来录制视频'" "$PLIST"
          # 相册写入权限
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string '需要保存照片到相册'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '需要访问相册来保存和查看照片'" "$PLIST"
          echo "=== Permissions added ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "NSCamera|NSMicrophone|NSPhoto"

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Clean ALL code signatures
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          # 递归删除所有签名残留（包括 Frameworks 内部）
          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -name "*.mobileprovision" -type f -delete 2>/dev/null || true
          find "$APP_PATH" -name "PkgInfo" -type f -delete 2>/dev/null || true
          echo "=== Verify we have Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No Frameworks dir"
          echo "=== Info.plist bundle id ==="
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist"

      - name: Package as IPA (ditto method)
        run: |
          rm -rf Payload
          mkdir -p Payload
          # ditto 保留所有 symlink、权限和元数据，比 cp -R 更可靠
          ditto "build/ios/iphoneos/Runner.app" "Payload/Runner.app"
          # ditto 压缩也能保留 symlink
          ditto -c -k --keepParent Payload watermark-camera.ipa
          rm -rf Payload
          echo "=== IPA size ==="
          ls -lh watermark-camera.ipa
          echo "=== Verify IPA contents ==="
          unzip -l watermark-camera.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera
          path: watermark-camera.ipa
          retention-days: 7
